# cargo-deny：依赖的许可证、安全公告与来源检查。CI 中运行 `cargo deny check`。

[graph]
all-features = false

[advisories]
# russh 等网络依赖出现过 CVE，公告一律视为错误
yanked = "deny"
# 无人维护的提醒只管直接依赖；间接依赖（多经锁定版本的 gpui 引入）由上游跟进
unmaintained = "workspace"
ignore = [
    # zip 8 的一组问题，修复在 zip 9。velopack 1.2 仍依赖 zip 8，但只用 ZipArchive 按索引逐条读取、
    # 写出单个文件，不调用 extract()、不用 ZipStreamReader，也未启用 aes-crypto 与 legacy-zip；
    # 解压的是校验过 SHA 的更新包。velopack 正式版升级到 zip 9 后删除
    { id = "RUSTSEC-2026-0367", reason = "velopack 不调用受影响的 extract()" },
    { id = "RUSTSEC-2026-0368", reason = "velopack 不调用受影响的 extract()" },
    { id = "RUSTSEC-2026-0369", reason = "velopack 不调用受影响的 extract()" },
    { id = "RUSTSEC-2026-0429", reason = "velopack 不调用受影响的 extract()" },
    { id = "RUSTSEC-2026-0546", reason = "velopack 不调用受影响的 extract()" },
    { id = "RUSTSEC-2026-0545", reason = "未启用 aes-crypto，不读加密条目" },
    { id = "RUSTSEC-2026-0547", reason = "未启用 legacy-zip" },
    { id = "RUSTSEC-2026-0548", reason = "velopack 不使用 ZipStreamReader" },
]

[licenses]
# MPL-2.0 为文件级弱著佐权，以依赖形式使用与 Apache-2.0 兼容
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots 分发的 Mozilla 根证书数据（Windows 上 velopack 检查更新时用）
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
